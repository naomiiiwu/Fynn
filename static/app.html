<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fynn — settlement reconciliation</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23E3EAE5%22%2F%3E%3Cpath%20d%3D%22M61%2050H41V72%22%20fill%3D%22none%22%20stroke%3D%22%235CA97E%22%20stroke-width%3D%2217%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M41%2054V39Q41%2025%2055%2025H67%22%20fill%3D%22none%22%20stroke%3D%22%232C3C58%22%20stroke-width%3D%2217%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
--paper:#F6F6F3;--panel:#FFFFFF;--panel2:#FCFCFA;
--ink:#14171B;--slate:#586170;--faint:#8A929E;
--rule:#EAE8E2;--ruleF:#D7D4CB;
--ledger:#16553E;--ledgerHi:#1D6B4F;--ledgerBg:#ECF3EF;
/* From the mark: its navy carries the wordmark, its green the accents. */
--navy:#2C3C58;--logoGreen:#5CA97E;--logoBg:#E3EAE5;
--flag:#8C5200;--flagBg:#FCF3E4;--flagRule:#EFD9AF;
--link:#1D4E79;--linkBg:#EDF2F8;
--danger:#A62B21;--dangerBg:#FCEEEC;--dangerRule:#EFC5BF;
--bubF:#F3F2EE;
--sh-sm:0 1px 2px rgba(20,23,27,.045);
--sh:0 1px 3px rgba(20,23,27,.05),0 10px 28px -14px rgba(20,23,27,.16);
--r:12px;--r-sm:8px;--r-xs:6px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);
-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;line-height:1.55;
font-size:14px}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
letter-spacing:-.01em}

button{font:500 13px Inter,sans-serif;padding:8px 14px;border-radius:var(--r-xs);cursor:pointer;
border:1px solid var(--ruleF);background:var(--panel);color:var(--ink);box-shadow:var(--sh-sm);
transition:background .15s,border-color .15s,box-shadow .15s,transform .06s}
button:hover{background:var(--panel2);border-color:var(--slate)}
button:active{transform:translateY(.5px)}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
button.go{background:var(--ledger);color:#fff;border-color:var(--ledger)}
button.go:hover{background:var(--ledgerHi);border-color:var(--ledgerHi)}
button.ghost{box-shadow:none;background:var(--panel);color:var(--slate);
padding:5px 11px;font-size:12px}
button.ghost:hover{background:var(--bubF);color:var(--ink)}
button:disabled{opacity:.5;cursor:default;box-shadow:none}
button:disabled:hover{background:var(--panel);border-color:var(--ruleF)}
input,select{font:400 13.5px Inter,sans-serif;padding:9px 12px;border:1px solid var(--ruleF);
border-radius:var(--r-sm);background:var(--panel);color:var(--ink);width:100%;
transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#AEB4BD}
input:hover,select:hover{border-color:var(--slate)}
input:focus,select:focus{outline:none;border-color:var(--link);
box-shadow:0 0 0 3px rgba(29,78,121,.13)}

/* ── chrome ── */
.top{border-bottom:1px solid var(--rule);background:rgba(255,255,255,.85);
backdrop-filter:saturate(1.6) blur(10px);position:sticky;top:0;z-index:20}
.topin{max-width:1120px;margin:0 auto;padding:11px 22px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-size:15.5px;font-weight:650;
letter-spacing:-.021em;color:var(--navy)}
/* Fynn's own mark, drawn as SVG so it stays crisp at 18px in a browser tab and
   at any density. It carries its own ground, so no background here. */
.mark{width:26px;height:26px;flex:0 0 26px;display:block}
.firm{font-size:12.5px;color:var(--faint);padding-left:14px;border-left:1px solid var(--rule);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:340px}
.tabs{margin-left:auto;display:flex;gap:2px;align-items:center}
.who{font-size:12.5px;color:var(--faint);padding-left:12px;border-left:1px solid var(--rule);
white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.tab{background:transparent;border:1px solid transparent;color:var(--slate);
padding:6px 12px;box-shadow:none;border-radius:var(--r-xs);font-weight:500}
.tab:hover{background:var(--bubF);border-color:transparent;color:var(--ink)}
.tab.on{background:var(--ledgerBg);color:var(--ledger);font-weight:600;border-color:transparent}
a.tab.out{text-decoration:none;color:var(--faint);display:inline-flex;align-items:center;
font:500 13px Inter,sans-serif;margin-left:8px;padding-left:12px;
border-left:1px solid var(--rule);border-radius:0}
a.tab.out:hover{color:var(--ink);background:transparent}

.stage{display:flex;align-items:flex-start;max-width:1120px;margin:0 auto;
padding:28px 22px 72px;justify-content:center}
.main{width:640px;flex:0 0 640px;background:var(--panel);border:1px solid var(--rule);
border-radius:var(--r);padding:30px 34px 34px;min-height:520px;box-shadow:var(--sh)}
/* The account mapping is three columns of its own; 640px cuts the last one off. */
.main.wide{width:880px;flex-basis:880px}
.stage.wide{max-width:none}
.drawer{flex:0 0 0;width:0;overflow:hidden;margin-left:0;
transition:flex-basis .42s cubic-bezier(.4,0,.2,1),width .42s cubic-bezier(.4,0,.2,1),margin-left .42s}
.drawer.open{flex:0 0 428px;width:428px;margin-left:18px}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}
*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

h1{font-size:22px;font-weight:650;letter-spacing:-.025em;line-height:1.25}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.headright{display:flex;align-items:center;gap:10px;flex:0 0 auto}
/* A step you came into and will leave again, so it is signposted above the
   title rather than buried among the page's own actions. */
.back{display:inline-flex;align-items:center;gap:5px;margin:-6px 0 14px -8px;
padding:5px 10px 5px 8px;box-shadow:none;border-color:transparent;background:transparent;
color:var(--slate);font-size:12.5px}
.back:hover{background:var(--bubF);border-color:transparent;color:var(--ink)}
.count{font-size:12.5px;color:var(--ledger);white-space:nowrap;background:var(--ledgerBg);
padding:4px 11px;border-radius:99px;font-weight:500}
.count b{font-weight:600}
.sub{font-size:13.5px;color:var(--slate);margin:8px 0 24px;max-width:56ch}

/* ── flash banner: a connection result is news, not an alert() ── */
.flashwrap{max-width:1120px;margin:0 auto;padding:0 22px}
.flash{display:flex;gap:11px;align-items:flex-start;margin-top:18px;padding:13px 16px;
border-radius:var(--r-sm);font-size:13.5px;border:1px solid;animation:drop .3s ease}
.flash.ok{background:var(--ledgerBg);border-color:#BEDACB;color:var(--ledger)}
.flash.bad{background:var(--dangerBg);border-color:var(--dangerRule);color:var(--danger)}
.flash b{display:block;margin-bottom:2px}
/* The message can carry a redirect URI, which must stay readable rather than
   stretching the banner off the page. */
.flash>span{min-width:0;overflow-wrap:anywhere}
.flash .x{margin-left:auto;cursor:pointer;border:none;background:transparent;box-shadow:none;
color:inherit;opacity:.6;padding:0 4px;font-size:16px;line-height:1}
.flash .x:hover{opacity:1;background:transparent}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}

/* ── payout cards ── */
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;
margin-bottom:26px}
.strip div{padding:13px 15px;border:1px solid var(--rule);border-radius:var(--r-sm);
background:var(--panel2)}
.strip .p{font-size:11.5px;color:var(--faint);margin-bottom:4px;text-transform:uppercase;
letter-spacing:.05em;font-weight:600}
.strip .v{font-size:19px;letter-spacing:-.02em}
.strip .r{font-size:11.5px;color:var(--flag);margin-top:3px}

.sect{display:flex;justify-content:space-between;align-items:baseline;
font-size:11.5px;font-weight:700;padding-bottom:9px;border-bottom:1px solid var(--rule);
text-transform:uppercase;letter-spacing:.055em;color:var(--slate)}
.sect span{font-weight:500;font-size:12px;color:var(--faint);text-transform:none;letter-spacing:0}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
padding:14px 12px 14px 13px;border:none;border-bottom:1px solid var(--rule);
border-left:3px solid transparent;background:transparent;cursor:pointer;
transition:background .16s,border-color .16s;border-radius:0;box-shadow:none}
.row:hover{background:var(--panel2);border-color:var(--rule)}
.row.active{background:var(--flagBg);border-left-color:var(--flag)}
.row .b{flex:1;min-width:0}
/* Both are spans so the row can stay a <button>; without this they run on as
   one sentence and the reason is indistinguishable from the title. */
.row .t,.row .m{display:block}
.row .t{font-size:14px;font-weight:600;margin-bottom:3px;letter-spacing:-.01em}
.row .m{font-size:12.5px;color:var(--slate);line-height:1.45}
.row .a{font-size:14px;font-weight:500;white-space:nowrap}
.tag{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--flagBg);
color:var(--flag);white-space:nowrap;font-weight:600;text-transform:uppercase;
letter-spacing:.04em;border:1px solid var(--flagRule)}

.gate{background:var(--flagBg);border:1px solid var(--flagRule);border-radius:var(--r-sm);
padding:17px 20px;margin:22px 0 0}
.gate h2{font-size:14.5px;font-weight:650;color:var(--flag);margin-bottom:4px;
letter-spacing:-.01em}
.gate p{font-size:13px;color:var(--flag);opacity:.9}
.closed{background:linear-gradient(180deg,var(--ledgerBg),#F4F8F6);
border:1px solid #CFE2D8;border-radius:var(--r-sm);padding:19px 21px;margin-bottom:24px}
.closed h2{font-size:15.5px;font-weight:650;color:var(--ledger);margin-bottom:4px;
letter-spacing:-.015em}
.closed p{font-size:13px;color:var(--ledger);opacity:.88}
.closed .act{margin-top:15px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.closed .st{font-size:12.5px;color:var(--ledger);opacity:.88}

.je{border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden;margin-bottom:14px}
.jrow{display:flex;justify-content:space-between;align-items:center;width:100%;
padding:13px 16px;border:none;border-bottom:1px solid var(--rule);background:transparent;
font:inherit;color:inherit;cursor:pointer;text-align:left;border-radius:0;box-shadow:none;
font-weight:500}
.jrow:last-of-type{border-bottom:none}
.jrow:hover{background:var(--panel2);border-color:var(--rule)}
.jright{display:flex;gap:16px;align-items:center}
.jview{font-size:12.5px;color:var(--link);font-weight:500}
.detail{border-top:1px solid var(--rule);padding:17px 19px;display:none;background:var(--panel2)}
.detail.on{display:block}
.detail h3{font-size:12px;font-weight:700;margin-bottom:11px;text-transform:uppercase;
letter-spacing:.05em;color:var(--slate)}
.dl{display:flex;justify-content:space-between;gap:16px;font-size:13px;padding:7px 0;
border-bottom:1px solid var(--rule)}
.dl span:first-child{color:var(--slate)}
.dl:last-of-type{border-bottom:none;font-weight:600;padding-top:10px}
.dl:last-of-type span:first-child{color:var(--ink)}

.trail{border:1px solid var(--rule);border-radius:var(--r-sm);padding:4px 18px;margin-top:10px;
background:var(--panel2);max-height:290px;overflow-y:auto}
.tr{display:flex;gap:13px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:12.5px;
align-items:flex-start;line-height:1.5}
.tr:last-child{border-bottom:none}
.dot{width:7px;height:7px;border-radius:50%;margin-top:6px;flex:0 0 7px}
.ts{color:var(--faint);font-size:11px;white-space:nowrap;padding-top:1px}
.note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.55}

/* ── upload ── */
.drop{border:1.5px dashed var(--ruleF);border-radius:var(--r);padding:46px 20px;text-align:center;
background:var(--panel2);cursor:pointer;transition:border-color .18s,background .18s}
.drop:hover{border-color:var(--slate);background:var(--bubF)}
.drop.over{border-color:var(--ledger);background:var(--ledgerBg)}
.drop .ic{margin:0 auto 12px;width:38px;height:38px;display:grid;place-items:center;
color:var(--faint)}
.drop.over .ic{color:var(--ledger)}
.drop p{font-size:13.5px;color:var(--slate)}
.drop b{color:var(--ledger);font-weight:600}
#file{display:none}
.files{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.fc{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);
border-radius:var(--r-sm);padding:12px 14px;font-size:13px;background:var(--panel2)}
.fc .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
font-weight:500}
.fc .ok{color:var(--ledger)}
.fc .er{color:var(--danger)}
.fc .pd{color:var(--faint)}
.field{margin-top:20px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
.field .hint{font-size:12px;color:var(--faint);margin-top:7px;line-height:1.5}
.field label.pill{display:inline-flex;align-items:center;gap:7px;width:auto;
border:1px solid var(--ruleF);border-radius:99px;padding:7px 14px;font-size:13px;
font-weight:500;margin:0 6px 6px 0;cursor:pointer;user-select:none;
transition:border-color .15s,background .15s,color .15s}
.field label.pill:hover{border-color:var(--slate)}
.field label.pill input{display:none;width:auto}
.field label.pill.on{border-color:var(--ledger);background:var(--ledgerBg);color:var(--ledger)}

.rules-t{width:100%;border-collapse:collapse;font-size:13px}
.rules-t th{text-align:left;font-weight:700;color:var(--slate);font-size:10.5px;
padding:9px 8px;border-bottom:1px solid var(--ruleF);text-transform:uppercase;
letter-spacing:.055em}
.rules-t td{padding:10px 8px;border-bottom:1px solid var(--rule);vertical-align:middle}
.rules-t tbody tr:last-child td{border-bottom:none}
.rules-t tbody tr:hover{background:var(--panel2)}
.rules-t td.num,.rules-t th.num{text-align:right}
.src{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--bubF);
color:var(--slate);font-weight:600;white-space:nowrap}
.src.firm{background:var(--ledgerBg);color:var(--ledger)}
.sug{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--flagBg);
color:var(--flag);font-weight:600;border:1px solid var(--flagRule)}
.warn{font-size:10.5px;padding:3px 8px;border-radius:99px;background:var(--dangerBg);
color:var(--danger);font-weight:600;border:1px solid var(--dangerRule);white-space:nowrap}

.ledrow{display:flex;justify-content:space-between;align-items:center;gap:14px;
padding:14px 16px;border-bottom:1px solid var(--rule);font-size:13.5px;font-weight:500}
.ledrow:last-child{border-bottom:none}
.ledright{display:flex;gap:10px;align-items:center}
/* The redirect URI is long and must be copied whole, so it wraps under its
   label rather than being truncated to fit the row. */
.ledrow.redir{display:block;padding:0 16px 14px;font-size:12px;color:var(--faint);
font-weight:400;background:var(--panel2)}
.ledrow.redir code{display:block;margin-top:5px;font:500 11.5px "IBM Plex Mono",monospace;
word-break:break-all;color:var(--ink);user-select:all;background:var(--panel);
border:1px solid var(--rule);border-radius:var(--r-xs);padding:8px 10px}
.ok-txt{color:var(--ledger);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ok-txt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ledger)}
.pd-txt{color:var(--faint);font-weight:400}
.ro-txt{color:var(--flag);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.ro-txt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--flag)}
a.btn-link{font:500 13px Inter,sans-serif;padding:8px 14px;border-radius:var(--r-xs);
border:1px solid var(--ledger);background:var(--ledger);color:#fff;text-decoration:none;
box-shadow:var(--sh-sm);transition:background .15s}
a.btn-link:hover{background:var(--ledgerHi)}

/* ── drawer chat ── */
.chat{width:428px;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
display:flex;flex-direction:column;height:580px;box-shadow:var(--sh);overflow:hidden}
.chat header{padding:16px 20px;border-bottom:1px solid var(--rule);background:var(--panel2)}
.chat .ct{font-size:14px;font-weight:650;letter-spacing:-.015em}
.chat .cs{font-size:12px;color:var(--faint);margin-top:2px}
.thread{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;
white-space:pre-wrap}
.bub.f{background:var(--bubF);border-bottom-left-radius:5px;align-self:flex-start}
.bub.u{background:var(--ledger);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.ev{background:var(--linkBg);color:var(--link);border-radius:var(--r-sm);padding:12px 14px;
font-size:12.5px;border:1px solid #D5E2EF}
.ev b{display:block;font-size:10.5px;margin-bottom:4px;text-transform:uppercase;
letter-spacing:.05em}
.typing{display:flex;gap:4px;padding:13px 15px;background:var(--bubF);border-radius:14px;
border-bottom-left-radius:5px;align-self:flex-start;width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.foot{border-top:1px solid var(--rule);padding:13px 16px;background:var(--panel2)}
.ask{display:flex;gap:8px;margin-bottom:10px}
.ask button{flex:0 0 auto}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acts select{flex:1;min-width:0}
.scope{font-size:12px;color:var(--slate);display:flex;align-items:flex-start;gap:7px;
margin-top:10px;cursor:pointer;line-height:1.45}
.scope input{width:auto;flex:0 0 auto;margin-top:1px;accent-color:var(--ledger)}
.loading{padding:64px 0;text-align:center;color:var(--faint);font-size:13.5px}
.err{background:var(--dangerBg);border:1px solid var(--dangerRule);color:var(--danger);
border-radius:var(--r-sm);padding:12px 15px;font-size:13.5px;margin-bottom:16px}

/* ── first-run setup ──
   Four short steps, and every answer is an ordinary setting you can change
   afterwards. Nothing here asks about your business for anyone's benefit but
   yours — a question you cannot act on is a question worth not asking. */
.ob-back{position:fixed;inset:0;background:rgba(20,23,27,.42);backdrop-filter:blur(3px);
display:grid;place-items:center;padding:24px;z-index:60;animation:fade .22s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ob{background:var(--panel);border-radius:14px;width:100%;max-width:470px;
box-shadow:0 24px 60px -20px rgba(20,23,27,.4);overflow:hidden;
animation:rise .26s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ob-top{padding:26px 30px 0;display:flex;align-items:center;gap:10px}
.ob-top .mark{width:28px;height:28px;flex:0 0 28px}
.ob-top .step{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:600;
letter-spacing:.04em;text-transform:uppercase}
.ob-body{padding:18px 30px 4px}
.ob-body h2{font-size:19px;font-weight:650;letter-spacing:-.02em;margin-bottom:7px}
.ob-body p.lead{font-size:13.5px;color:var(--slate);margin-bottom:6px}
.ob-body .field:first-of-type{margin-top:16px}
.ob-foot{padding:20px 30px 24px;display:flex;align-items:center;gap:10px}
.ob-foot .grow{flex:1}
.ob-skip{background:none;border:none;box-shadow:none;color:var(--faint);font-size:12.5px;
padding:8px 4px}
.ob-skip:hover{background:none;color:var(--slate);border-color:transparent}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--ruleF)}
.dots i.on{background:var(--ledger);width:16px;border-radius:3px}

<body>

<div class="top"><div class="topin">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Fynn">
      <rect width="100" height="100" rx="22" fill="var(--logoBg)"/>
      <path d="M61 50H41V72" fill="none" stroke="var(--logoGreen)" stroke-width="17"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 54V39Q41 25 55 25H67" fill="none" stroke="var(--navy)" stroke-width="17"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>Fynn</div>
  <div class="firm" id="firmname"></div>
  <div class="tabs" id="tabs"></div>
  <div class="who" id="whoami"></div>
</div></div>

<div class="flashwrap" id="flashwrap"></div>

<div class="stage">
  <div class="main" id="main"><p class="loading">Loading…</p></div>
  <div class="drawer" id="drawer"></div>
</div>

<div id="onboard"></div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?"−":"")+Math.abs(n).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S=null, TAB="cycle", ACTIVE=null, HISTORY=[], BUSY=false;

// Served by the API so the dropdown and the explainer offer the same accounts.
// The fallback is only for the moment before state has loaded.
let ACCOUNTS=["Sales Revenue","Sales Returns & Allowances","Commission Expense",
"Payment Processing Fees","Platform Service Fees","Marketing Expense","Shipping Expense",
"Shipping Income","Warehouse & Storage","GST Input Tax","Withholding Tax Receivable",
"Other Income","Other Expense","Clearing Account (hold)"];

async function api(path,opts={}){
  const r=await fetch(path,opts);
  if(!r.ok){ let d=r.statusText; try{ d=(await r.json()).detail||d; }catch(e){} throw new Error(d); }
  return r.status===204?null:r.json();
}

async function load(){
  try{
    S=await api("/api/state");
    if(S.posting_accounts && S.posting_accounts.length) ACCOUNTS = S.posting_accounts;
    render();
    // Resume where setup left off: connecting a ledger navigates away from the
    // page entirely, and restarting from step one would be a poor welcome.
    if(obNeeded() && !$(".ob-back"))
      obOpen(Number(sessionStorage.getItem(OB_KEY)) || 0);
  }
  catch(e){ $("#main").innerHTML=`<p class="loading">${esc(e.message)}</p>`; }
}

/* ── routing ──
   Every view has a URL. Uploading is a step you take from somewhere and come
   back from, not a place you live, so it is reached by a button and keeps a
   Back control rather than sitting in the tab bar beside the standing views. */
const VIEWS={cycle:viewCycle, upload:viewUpload, rules:viewRules,
             accounts:viewAccounts, settings:viewSettings};
const TABS=[["cycle","Cycle"],["rules","Rules"],["accounts","Accounts"],
            ["settings","Settings"]];
// Where Upload's Back returns to: wherever you opened it from.
let BACK_TO="cycle";

function route(){
  const name=(location.hash||"").replace(/^#\/?/,"").split("?")[0];
  return VIEWS[name] ? name : "cycle";
}

function go(name){
  const target="#/"+name;
  // Setting the hash fires hashchange, which renders. When it is already the
  // current hash no event fires, so render directly or the click does nothing.
  if(location.hash===target) render(); else location.hash=target;
}

function render(){
  TAB=route();
  if(TAB!=="upload") BACK_TO=TAB;
  $("#firmname").textContent = S.firm.firm + (S.cycle? " · cycle "+S.cycle.cycle : "");
  $("#whoami").textContent = S.user ? S.user.name || S.user.email : "";
  $("#whoami").title = S.user ? S.user.email : "";
  $("#tabs").innerHTML = TABS.map(([k,l])=>
    `<button class="tab${TAB===k?" on":""}" data-tab="${k}">${l}</button>`).join("")
    + `<a class="tab out" href="/logout">Sign out</a>`;
  document.querySelectorAll("button.tab").forEach(b=>b.onclick=()=>{
    closeDrawer(); go(b.dataset.tab);
  });
  const wide = TAB==="accounts";
  $("#main").classList.toggle("wide", wide);
  document.querySelector(".stage").classList.toggle("wide", wide);
  VIEWS[TAB]();
}

// The browser's own Back and Forward now move between views, because each one
// is a real history entry rather than a variable.
addEventListener("hashchange", ()=>{ closeDrawer(); render(); });

/* ── cycle ── */
function viewCycle(){
  if(!S.cycle){
    $("#main").innerHTML=`
      <div class="head"><h1>No cycle open</h1></div>
      <p class="sub">Upload a settlement export to start a close, or load the sample
      cycle to see how it works.</p>
      <div class="acts">
        <button class="go" id="toupload">Upload a file</button>
        <button id="sample">Load sample cycle</button>
      </div>`;
    $("#toupload").onclick=()=>go("upload");
    $("#sample").onclick=async()=>{ await api("/api/cycle/sample",{method:"POST"}); await load(); };
    return;
  }
  const D=S.cycle, done=D.open_exceptions===0;
  let h=`<div class="head"><h1>Cycle ${esc(D.cycle)}</h1>
    <span class="headright"><span class="count"><b class="num">${D.lines_classified}</b> of
      <b class="num">${D.lines_total}</b> classified</span>
      <button id="toupload">Add files</button></span></div>
    <p class="sub">Settlement lines reconciled against the payout each platform reported.</p>
    <div class="strip">`;
  D.platforms.forEach(p=>{
    h+=`<div><p class="p">${esc(p.platform)}</p><p class="v num">${fmt(p.reported_payout)}</p>
      ${Math.abs(p.residual)>=0.005?`<p class="r num">residual ${fmt(p.residual)}</p>`:""}</div>`;
  });
  h+=`</div>`;

  // A platform with no stated payout has nothing for the bank deposit to match:
  // the clearing line would post as zero. Shown whether or not the cycle is
  // otherwise ready, because writing the difference off does not fix it — it
  // only hides it behind a balanced entry.
  const noPayout = D.platforms.filter(p=>Math.abs(p.reported_payout) < 0.005);
  if(noPayout.length){
    const names = noPayout.map(p=>p.platform);
    h+=`<div class="gate" style="margin:0 0 22px"><h2>No payout stated for
      ${names.map(esc).join(", ")}</h2>
      <p>Fynn has nothing to reconcile against, so the clearing line would post
      as 0.00 and no bank deposit could ever match it. If the export did not
      carry the payout on a row of its own, enter what was actually deposited.</p>
      <div class="field" style="margin-top:12px">
        <div class="ask"><input id="fix-reported"
          placeholder="${esc(names[0])}=0.00" autocomplete="off">
          <button id="fix-save">Set payout</button></div>
        <p class="hint" id="fix-status">One per platform, separated by
        semicolons — <span class="num">${names.map(n=>esc(n)+"=0.00").join(";")}</span></p>
      </div></div>`;
  }

  if(!done){
    h+=`<p class="sect">Needs your review <span>${D.open_exceptions} open</span></p>`;
    D.exceptions.forEach(e=>{
      h+=`<button class="row${ACTIVE===e.key?" active":""}" data-k="${encodeURIComponent(e.key)}">
        <span class="b"><span class="t">${esc(e.platform)} — ${esc(label(e))}</span>
        <span class="m">${esc(e.why)}</span></span>
        <span class="a num">${fmt(e.amount)}</span><span class="tag">Open</span></button>`;
    });
    // Without this the only button on the page is "Close this cycle without
    // posting", which reads as though posting were never on offer. It is — it
    // is gated, and the gate should say so rather than being inferred from an
    // absence.
    const n = D.open_exceptions;
    // A residual is the one exception an approval cannot always answer: if the
    // file simply never stated the payout, the honest fix is to supply it, not
    // to write the whole deposit off to an account.
    h+=`<div class="gate"><h2>Posting is held until ${n} ${n===1?"exception is":"exceptions are"} resolved</h2>
      <p>Each one changes the payout, so a journal posted now would be one Fynn
      already knows is wrong. Open any above and say where it belongs — most
      become a rule, and will not be asked again next cycle.</p></div>`;
  }else{
    h+=`<div class="closed"><h2>Cycle ${esc(D.cycle)} ready to post</h2>
      <p>${D.lines_total} lines classified across ${D.platforms.length} platforms,
      summarised into ${D.platforms.length} balanced journal entries.</p>
      <div class="act"><button class="go" id="post">Post entries</button>
      <span class="st" id="poststatus">Nothing posts until you press this.</span></div></div>`;
  }

  h+=`<p class="sect" style="margin-top:26px;margin-bottom:12px">Journal entries
    <span>Open any entry to trace it back</span></p><div class="je">`;
  D.platforms.forEach(p=>{
    h+=`<button class="jrow" data-je="${esc(p.platform)}"><span>${esc(p.platform)}</span>
      <span class="jright"><span class="num">${fmt(p.classified_total)}</span>
      <span class="jview">View</span></span></button>
      <div class="detail" id="d-${p.platform.replace(/\s/g,'')}"></div>`;
  });
  h+=`</div>
    <p class="sect" style="margin-top:26px;margin-bottom:10px">Audit trail
      <span><a href="/api/audit" style="color:var(--link)">Export working paper</a></span></p>
    <div class="trail" id="trail"><p class="note">Loading…</p></div>
    <p class="note">${esc(D.retention)}</p>
    <p class="note" style="margin-top:18px"><button id="clear">Close this cycle without posting</button></p>`;

  $("#main").innerHTML=h;
  $("#toupload").onclick=()=>go("upload");
  if($("#fix-save")){
    const save=async()=>{
      const v=$("#fix-reported").value.trim();
      if(!v) return;
      $("#fix-save").disabled=true; $("#fix-status").textContent="Setting…";
      try{
        await api("/api/cycle/reported",{method:"PUT",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({reported:v})});
        await load();
      }catch(e){
        $("#fix-save").disabled=false;
        $("#fix-status").textContent=e.message;
      }
    };
    $("#fix-save").onclick=save;
    $("#fix-reported").onkeydown=ev=>{ if(ev.key==="Enter") save(); };
  }
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>openExc(decodeURIComponent(r.dataset.k)));
  document.querySelectorAll(".jrow").forEach(b=>b.onclick=()=>toggleJE(b.dataset.je));
  if($("#post")) $("#post").onclick=post;
  $("#clear").onclick=async()=>{
    if(!confirm("Close the cycle without posting? Rules you have approved are kept.")) return;
    await api("/api/cycle",{method:"DELETE"}); ACTIVE=null; closeDrawer(); await load();
  };
  loadTrail();
}

function label(e){
  const m={orphan_refund:"refund from an earlier cycle",partial_refund:"partial refund",
  unknown_label:"unrecognised fee",withheld_balance:"withheld balance",residual:"unexplained residual"};
  return m[e.kind]||e.kind;
}

async function loadTrail(){
  try{
    const t=await api("/api/audit.json");
    const c={source:"var(--faint)",classify:"var(--faint)",exception:"var(--flag)",
      decision:"var(--ledger)",rule:"var(--ledger)",post:"var(--ledger)"};
    $("#trail").innerHTML=t.records.map(r=>
      `<div class="tr"><span class="dot" style="background:${c[r.kind]||'var(--faint)'}"></span>
      <span class="ts num">${esc(r.at.slice(11,19))}</span><span>${esc(r.message)}</span></div>`).join("")
      ||`<p class="note">No activity yet.</p>`;
  }catch(e){ $("#trail").innerHTML=`<p class="note">${esc(e.message)}</p>`; }
}

async function post(){
  const btn=$("#post"), st=$("#poststatus");
  btn.disabled=true; st.textContent="Posting…";
  try{
    const r=await api("/api/post",{method:"POST"});
    const refs=r.entries.map(e=>e.reference).join(", ");
    st.textContent = r.adapter==="dry-run"
      ? `Prepared via dry run — ${refs}. Nothing was sent to a ledger.`
      : `Sent to ${r.adapter} as DRAFT — ${refs}.`;
    loadTrail();
  }catch(e){
    btn.disabled=false;
    // Naming a screen without a way to reach it is most of the distance to
    // not having said it.
    st.innerHTML = esc(e.message) + (/not mapped/i.test(e.message)
      ? ` <a href="#/accounts" class="jview">Open Accounts →</a>` : "");
  }
}

async function toggleJE(platform){
  const el=$("#d-"+platform.replace(/\s/g,''));
  if(el.classList.contains("on")){ el.classList.remove("on"); return; }
  document.querySelectorAll(".detail").forEach(d=>d.classList.remove("on"));
  try{
    const j=await api("/api/journal/"+encodeURIComponent(platform));
    el.innerHTML=`<h3>${esc(platform)} — ${esc(j.reference)}</h3>`+
      j.lines.map(l=>`<div class="dl"><span>${esc(l.account)}</span>
        <span class="num">${l.side==="debit"?"":"−"}${l.amount.toFixed(2)}</span></div>`).join("")+
      `<div class="dl"><span>Debits / credits</span>
        <span class="num">${j.total_debit.toFixed(2)} / ${j.total_credit.toFixed(2)}</span></div>`+
      `<p class="note">${j.balanced?"Balanced.":"Not balanced — unresolved exceptions are excluded."}</p>`;
    el.classList.add("on");
  }catch(e){ el.innerHTML=`<p class="note">${esc(e.message)}</p>`; el.classList.add("on"); }
}

/* ── exception drawer ── */
function closeDrawer(){ ACTIVE=null; $("#drawer").classList.remove("open"); $("#drawer").innerHTML=""; }

async function openExc(key){
  ACTIVE=key; HISTORY=[];
  const e=S.cycle.exceptions.find(x=>x.key===key);
  if(!e) return;
  viewCycle();
  const widen = e.category
    ? `<label class="scope"><input type="checkbox" id="wide">
       Apply to everything Lazada classifies as “${esc(e.category)}”</label>` : "";
  $("#drawer").innerHTML=`<div class="chat">
    <header><p class="ct">${esc(e.platform)} — ${fmt(e.amount)}</p>
      <p class="cs">Fynn found this while classifying</p></header>
    <div class="thread" id="thread"></div>
    <div class="foot">
      <div class="ask"><input id="q" placeholder="Ask about this exception…" autocomplete="off">
        <button id="send">Ask</button></div>
      <div class="acts"><select id="acct">${ACCOUNTS.map(a=>
        `<option ${e.evidence&&e.evidence.suggested_account===a?"selected":""}>${esc(a)}</option>`).join("")}
        </select><button class="go" id="ok">Approve</button></div>
      ${widen}
    </div></div>`;
  $("#drawer").classList.add("open");

  // Wire the controls before anything is awaited. The opening message can take
  // a second when the investigator is asked, and a visible Approve button that
  // silently does nothing is worse than one that is not there yet.
  $("#send").onclick=ask;
  $("#q").onkeydown=ev=>{ if(ev.key==="Enter") ask(); };
  $("#ok").onclick=approve;
  $("#q").focus();

  try{
    const op=await api("/api/exception/opening?key="+encodeURIComponent(key));
    bubble(op.message,"f"); HISTORY.push({role:"assistant",content:op.message});
  }catch(err){ bubble("Could not load: "+err.message,"f"); }
  if(e.evidence){
    const d=document.createElement("div"); d.className="ev";
    d.innerHTML=`<b>Evidence · ${e.evidence.confidence}% confidence · ${esc(e.evidence.source.replace("_"," "))}</b>${esc(e.evidence.summary)}`;
    $("#thread").appendChild(d);
  }
}

function bubble(text,who){
  const b=document.createElement("div"); b.className="bub "+who; b.textContent=text;
  $("#thread").appendChild(b); $("#thread").scrollTop=$("#thread").scrollHeight; return b;
}

async function ask(){
  const q=$("#q").value.trim(); if(!q||BUSY) return;
  BUSY=true; $("#q").value=""; bubble(q,"u"); HISTORY.push({role:"user",content:q});
  const t=document.createElement("div"); t.className="typing"; t.innerHTML="<i></i><i></i><i></i>";
  $("#thread").appendChild(t); $("#thread").scrollTop=$("#thread").scrollHeight;
  try{
    const r=await api("/api/exception/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:ACTIVE,history:HISTORY})});
    t.remove(); bubble(r.message,"f"); HISTORY.push({role:"assistant",content:r.message});
  }catch(e){ t.remove(); bubble("Error: "+e.message,"f"); }
  BUSY=false;
}

async function approve(){
  const account=$("#acct").value;
  const scope = ($("#wide") && $("#wide").checked) ? "category" : "label";
  try{
    await api("/api/approve",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:ACTIVE,account,save_rule:true,scope})});
    bubble(`Recorded to ${account}. Fynn will treat this the same way next cycle unless you say otherwise.`,"f");
    setTimeout(async()=>{ closeDrawer(); await load(); },1000);
  }catch(e){ bubble("Could not approve: "+e.message,"f"); }
}

/* ── upload ── */
function viewUpload(){
  const backLabel={cycle:"Cycle",rules:"Rules",accounts:"Accounts",settings:"Settings"}[BACK_TO]
                  || "Cycle";
  $("#main").innerHTML=`
    <button class="back" id="back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6"/></svg>${esc(backLabel)}</button>
    <div class="head"><h1>Upload settlement files</h1></div>
    <p class="sub">Shopee, Lazada or TikTok Shop. Fynn reads each platform's own export —
    wide order statements and long transaction statements alike — and folds them into
    one cycle.</p>
    <div class="drop" id="drop"><div class="ic">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M7 9l5-5 5 5"/><path d="M12 4v12"/></svg></div>
      <p>Drop CSV or XLSX files here, or <b>browse</b></p></div>
    <input type="file" id="file" multiple accept=".csv,.xlsx,.xls">
    <div class="field"><label>Reported payout (optional)</label>
      <input id="reported" placeholder="Lazada=1038.00;Shopee=725.00">
      <p class="hint">Only needed when the file does not state the payout on a row of its own.</p>
    </div>
    <div class="files" id="files"></div>`;
  // history.back() so Back and the browser's own back agree, rather than
  // pushing a second entry that the user then has to walk out of twice.
  $("#back").onclick=()=>{ if(history.length>1) history.back(); else go(BACK_TO); };
  const drop=$("#drop"), file=$("#file");
  drop.onclick=()=>file.click();
  drop.ondragover=e=>{e.preventDefault();drop.classList.add("over");};
  drop.ondragleave=()=>drop.classList.remove("over");
  drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");send([...e.dataTransfer.files]);};
  file.onchange=()=>send([...file.files]);
}

async function send(files){
  const list=$("#files");
  // Sequential: each file folds into the same cycle, and concurrent writes race.
  for(const f of files){
    const row=document.createElement("div");
    row.className="fc";
    row.innerHTML=`<span class="nm">${esc(f.name)}</span><span class="pd">reconciling…</span>`;
    list.appendChild(row);
    const fd=new FormData();
    fd.append("file",f);
    fd.append("reported",$("#reported").value||"");
    try{
      const r=await api("/api/upload",{method:"POST",body:fd});
      const d=r.digest;
      row.innerHTML=`<span class="nm">${esc(f.name)}</span>
        <span class="ok">cycle ${esc(d.cycle)} · ${d.lines_total} lines ·
        ${d.open_exceptions?d.open_exceptions+" to review":"ties out"}</span>`;
    }catch(e){
      row.innerHTML=`<span class="nm">${esc(f.name)}</span><span class="er">${esc(e.message)}</span>`;
    }
  }
  S=await api("/api/state");
  $("#firmname").textContent = S.firm.firm + (S.cycle? " · cycle "+S.cycle.cycle : "");
  // Named `actions`, not `go`: a local called `go` shadows the router function
  // of that name, and the click handler below then calls a <div>.
  let actions = $("#toreview-wrap");
  if(!actions){
    actions = document.createElement("div");
    actions.id = "toreview-wrap";
    actions.className = "acts";
    actions.style.marginTop = "16px";
    $("#files").appendChild(actions);
  }
  // Rebuilt rather than appended, so uploading twice does not leave two
  // buttons sharing one id.
  actions.innerHTML = `<button class="go" id="toreview">Review the cycle →</button>`;
  $("#toreview").onclick = () => go("cycle");
}

/* ── rules ── */
async function viewRules(){
  $("#main").innerHTML=`<div class="head"><h1>Rules</h1>
    <span class="count"><b class="num">${S.rules.total}</b> rules</span></div>
    <p class="sub">Every approval becomes a rule, applied across every client from then on.
    Fynn ships ${S.rules.starter} for fee names that have only one defensible treatment;
    your firm has decided ${S.rules.firm}.</p>
    <p class="loading">Loading…</p>`;
  try{
    const r=await api("/api/rules");
    const rows=r.rules.map(x=>{
      const starter = x.decided_by==="Fynn starter pack";
      const scope = x.category ? `everything classified “${esc(x.category)}”` : esc(x.label);
      return `<tr><td>${esc(x.platform||"All platforms")}</td><td>${scope}</td>
        <td>${esc(x.account)}</td><td class="num">${esc(x.side)}</td>
        <td><span class="src${starter?"":" firm"}">${starter?"Fynn":esc(x.decided_by||"baseline")}</span></td></tr>`;
    }).join("");
    $("#main").querySelector(".loading").outerHTML=
      `<table class="rules-t"><thead><tr><th>Platform</th><th>Applies to</th>
       <th>Account</th><th class="num">Usually</th><th>Decided by</th></tr></thead>
       <tbody>${rows}</tbody></table>`;
  }catch(e){ $("#main").querySelector(".loading").textContent=e.message; }
}

/* ── accounts ── */
/* Kept in step with models/account_map.py — the same rule, applied where the
   choice is actually made. */
const isClearing = a => String(a||"").trim().toLowerCase().endsWith("clearing account");
function clearingTypeOk(kind){
  const k = String(kind||"").trim().toLowerCase();
  if(!k) return true;                 // an unreadable type is not evidence of a mistake
  return k === "current" || k === "bank" || k.includes("current asset");
}

async function viewAccounts(){
  $("#main").innerHTML=`<div class="head"><h1>Accounts</h1></div>
    <p class="sub">A journal line names an account — “Marketing Expense”. Xero needs
    its account code, QuickBooks needs its account Id. Both come from your own chart
    of accounts, so Fynn cannot guess them, and will not post until every account a
    cycle touches has one.</p><p class="loading">Loading…</p>`;
  try{
    const [a, c] = await Promise.all([api("/api/accounts"), api("/api/accounts/chart")]);
    const byCode = Object.fromEntries((c.chart||[]).map(e=>[e.code, e]));
    let prefilled = 0;
    // The tax code belongs beside the account, not on a screen of its own: a
    // line posted to the right account with the wrong rate is still wrong, and
    // wrong in a way that reaches a return.
    const taxCell = x => `<td><input data-acct="${esc(x.account)}" data-f="tax"
        value="${esc(x.tax||"")}" placeholder="default"
        style="max-width:110px" title="Xero TaxType, or QuickBooks tax code. Blank
        leaves it to the account's own default."></td>`;
    const cell = x => {
      if(!c.connected){                       // no ledger yet: type the code
        return `<td><input data-acct="${esc(x.account)}" data-f="code" value="${esc(x.code)}"
                 placeholder="${a.ledger==="quickbooks"?"account Id":"code"}" style="max-width:120px"></td>
                <td><input data-acct="${esc(x.account)}" data-f="name" value="${esc(x.name)}"
                 placeholder="name in your ledger"></td>`;
      }
      const chosen = x.code || c.suggestions[x.account] || "";
      if(!x.code && chosen) prefilled++;
      const opts = [`<option value=""${chosen?"":" selected"}>— not mapped —</option>`]
        .concat(c.chart.map(e=>`<option value="${esc(e.code)}"${e.code===chosen?" selected":""}>
           ${esc(e.name)} · ${esc(e.code)}</option>`)).join("");
      let tag = (!x.code && chosen) ? `<span class="sug">suggested</span>` : "";
      // A clearing account holds money the platform has taken and not yet
      // deposited. Pointed at revenue it counts every payout as income twice;
      // pointed at an expense the balance sheet never shows what is owed.
      const picked = byCode[chosen];
      if(isClearing(x.account) && picked && !clearingTypeOk(picked.type))
        tag += ` <span class="warn" title="A clearing account must be a current asset — this one is ${esc(picked.type)}">wrong type</span>`;
      return `<td colspan="2"><select data-acct="${esc(x.account)}" data-f="code">${opts}</select> ${tag}</td>`;
    };
    const rows=a.accounts.map(x=>`<tr><td>${esc(x.account)}</td>${cell(x)}${taxCell(x)}</tr>`).join("");
    // "dry-run" is not a ledger anyone connects, so naming it in this copy asks
    // the reader to go and do something impossible.
    const dry = a.ledger === "dry-run";
    const named = dry ? "a ledger" : esc(a.ledger);
    $("#main").querySelector(".loading").outerHTML=
      `<p class="sect" style="margin-bottom:10px">Mapping for ${dry? "dry run" : esc(a.ledger)}
        <span>${a.unmapped.length? a.unmapped.length+" still to map" : "all mapped"}</span></p>
       ${c.connected? `<p class="note" style="margin:0 0 12px">Read from your ${esc(a.ledger)}
         chart of accounts — ${c.chart.length} accounts.${prefilled? " "+prefilled+
         " already matched to your chart — check them and press Save mapping." :
         " No confident matches, so nothing is pre-selected: choosing wrongly is worse than leaving it blank."}</p>`
         : `<p class="note" style="margin:0 0 12px">Connect ${named} in Settings and this
         becomes a list from your own chart of accounts instead of codes typed by hand.
         ${dry? "A dry run needs no mapping — it reports which accounts are still blank." : ""}</p>`}
       <table class="rules-t"><thead><tr><th>Fynn account</th>
       <th colspan="2">${c.connected? "Account in your ledger" :
          (a.ledger==="quickbooks"?"Account Id":"Code")+" / name"}</th>
       <th>Tax</th>
       </tr></thead><tbody>${rows}</tbody></table>
       <div class="acts" style="margin-top:20px">
         <button class="go" id="a-save">Save mapping</button>
         ${prefilled? `<button id="a-accept">Use all ${prefilled} suggestions</button>`:""}
         <span class="st" id="a-status"></span></div>
       <p class="note">Leave a code blank to unmap it. Switching ledger in Settings
       starts a separate mapping — a Xero code is not a QuickBooks Id.</p>
       <p class="note"><b>Clearing accounts</b> must be <b>current asset</b>
       accounts, one per marketplace so funds never commingle. Fynn debits the
       payout there; when the deposit lands you categorise it to the same
       account, which credits it back. Whatever is left is fees the platform
       netted off, or money still in transit.</p>
       <p class="note"><b>Tax</b> is the rate to send with lines on that account —
       a Xero TaxType such as <code>OUTPUT2</code> or <code>NONE</code>, or a
       QuickBooks tax code. Left blank, Fynn says nothing and your ledger applies
       the account's own default, which is safer than a rate Fynn guessed.</p>`;
    // The suggestions are already selected in each dropdown; this only says so
    // out loud and saves, so a firm connected to its ledger maps in one action
    // rather than confirming a dozen identical choices.
    if($("#a-accept")) $("#a-accept").onclick=()=>{
      $("#a-status").textContent="Suggestions selected — check them, then save.";
      $("#a-save").focus();
    };
    $("#a-save").onclick=async()=>{
      const mapping={};
      document.querySelectorAll("[data-acct]").forEach(i=>{
        const k=i.dataset.acct;
        mapping[k]=mapping[k]||{code:"",name:""};
        mapping[k][i.dataset.f]=i.value.trim();
        // With a dropdown the ledger's own name comes along for free, so the
        // saved mapping shows what it points at without another lookup.
        if(i.tagName==="SELECT" && i.value && byCode[i.value])
          mapping[k].name = byCode[i.value].name;
      });
      try{
        const r=await api("/api/accounts",{method:"PUT",
          headers:{"Content-Type":"application/json"},body:JSON.stringify({mapping})});
        $("#a-status").textContent = r.unmapped.length
          ? `Saved. ${r.unmapped.length} still unmapped.` : "Saved. Every account is mapped.";
        S=await api("/api/state");
      }catch(e){ $("#a-status").textContent=e.message; }
    };
  }catch(e){ $("#main").querySelector(".loading").textContent=e.message; }
}

function wireCopy(){
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{
    const el=$("#uri-"+b.dataset.copy);
    try{
      await navigator.clipboard.writeText(el.textContent.trim());
      b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1600);
    }catch(e){
      // Clipboard access needs a secure context and can still be refused;
      // selecting the text is the fallback that always works.
      const r=document.createRange(); r.selectNodeContents(el);
      const s=getSelection(); s.removeAllRanges(); s.addRange(r);
      b.textContent="Selected — press ⌘C"; setTimeout(()=>b.textContent="Copy",2400);
    }
  });
}

async function loadLedgers(){
  try{
    const r=await api("/api/ledger/status");
    const rows=Object.entries(r.ledgers).map(([k,v])=>{
      let right;
      if(v.connected){
        // A read-only connection looks identical to a full one until a post
        // fails, so it says so here rather than at the worst moment.
        const state = v.can_post===false
          ? `<span class="ro-txt">read only${v.org_name?" — "+esc(v.org_name):""}</span>`
          : `<span class="ok-txt">connected${v.org_name?" — "+esc(v.org_name):""}</span>`;
        right = `${state}<button data-dis="${k}">Disconnect</button>`;
      }else if(v.configured){
        right = `<a class="btn-link" href="/oauth/${k}/connect">Connect ${esc(v.label)}</a>`;
      }else{
        right = `<span class="pd-txt">no client credentials set</span>`;
      }
      // Registering this is a prerequisite, not a footnote: both providers match
      // it byte-for-byte and refuse the request on their own error page before
      // consent begins — so the failure looks like a broken link, and the user
      // never gets back here to read an explanation after the fact.
      // Fynn records what a connection was granted so it can refuse a post it
      // knows will fail. When that could not be stored, it cannot, and the
      // failure arrives from the ledger instead — worth saying where the
      // connection is shown rather than leaving it to be discovered.
      if(v.connected && !v.scopes){
        return `<div class="ledrow"><span>${esc(v.label)}</span>
                <span class="ledright">${right}</span></div>
                <div class="ledrow redir"><span>Permissions were not recorded for
                this connection, so Fynn cannot tell in advance whether it may post
                — a ledger that refuses will say so only when you press Post. Run
                the migrations, then disconnect and reconnect to fix it.</span></div>`;
      }
      if(v.connected && v.can_post===false){
        return `<div class="ledrow"><span>${esc(v.label)}</span>
                <span class="ledright">${right}</span></div>
                <div class="ledrow redir"><span>Fynn can read this ${esc(v.label)}
                organisation — enough to import the chart of accounts and map every
                account — but not write journals. Enable
                <b>${esc(v.post_scope||"the posting scope")}</b> on the app, then
                disconnect and connect again to post.</span></div>`;
      }
      const uri = (v.connected || !v.configured) ? "" : `<div class="ledrow redir">
        <span>Add this redirect URI to your ${esc(v.label)} app first — it is matched
        exactly, and ${esc(v.label)} shows its own error page if it is missing.</span>
        <code id="uri-${k}">${esc(v.redirect_uri||"")}</code>
        <button class="ghost" data-copy="${k}" style="margin-top:7px">Copy</button></div>`;
      return `<div class="ledrow"><span>${esc(v.label)}</span>
              <span class="ledright">${right}</span></div>${uri}`;
    }).join("");
    $("#ledgers").innerHTML = `<p class="sect" style="margin-top:30px;margin-bottom:10px">
      Connections</p>
      <div class="je">${rows}</div>`;
    wireCopy();
    document.querySelectorAll("[data-dis]").forEach(b=>b.onclick=async()=>{
      if(!confirm("Disconnect? The account mapping is kept.")) return;
      await api("/api/ledger/disconnect?ledger="+encodeURIComponent(b.dataset.dis),{method:"POST"});
      S=await api("/api/state"); viewSettings();
    });
  }catch(e){ $("#ledgers").innerHTML=`<p class="note">${esc(e.message)}</p>`; }
}

/* What DATABASE_URL parses to, minus the password. A rejected password is the
   least specific error Postgres has — showing the fields ends the guessing. */
function connectionTable(c){
  if(!c || !c.host) return "";
  const yes = v => v ? `<span class="ok-txt">yes</span>` : `<span class="pd-txt">no</span>`;
  const bad = (v,msg) => v ? `<span style="color:var(--danger);font-weight:600">${esc(msg)}</span>`
                           : `<span class="pd-txt">no</span>`;
  const rows = [
    ["Username sent", `<code>${esc(c.user||"(none)")}</code>`],
    ["Host", `<code>${esc(c.host)}</code>`],
    ["Port", `<code>${esc(c.port||"(none)")}</code>`],
    ["Database", `<code>${esc(c.database||"(none)")}</code>`],
    ["Using the pooler", yes(c.is_pooler)],
    ["Username has project ref", c.is_pooler && !c.username_has_project_ref
      ? `<span style="color:var(--danger);font-weight:600">no — the pooler needs postgres.&lt;ref&gt;</span>`
      : yes(c.username_has_project_ref)],
    ["Password present", c.password_present ? yes(true)
      : `<span style="color:var(--danger);font-weight:600">no</span>`],
    ["Password still the placeholder", bad(c.password_is_placeholder,"yes — replace it")],
    ["Password needs encoding", bad(c.password_needs_encoding,"yes — contains @ / ? # [ ] or a space")],
  ];
  return `<table class="rules-t" style="margin-top:12px"><thead><tr>
      <th colspan="2">What DATABASE_URL parses to (password never shown)</th></tr></thead><tbody>`
    + rows.map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join("")
    + `</tbody></table>`;
}

async function loadDiagnostics(){
  try{
    const d=await api("/api/diagnostics"), st=d.storage;
    const tables=Object.entries(st.tables||{});
    const ok = st.connected && tables.every(([,t])=>t.ok);
    $("#d-head").textContent = ok ? "connected" : "not saving";
    $("#d-head").style.color = ok ? "var(--ledger)" : "var(--flag)";
    let h = `<div class="${ok?"closed":"err"}" style="margin-bottom:0">
      <p style="font-size:13.5px">${esc(st.detail)}</p></div>`;
    if(tables.length){
      h += `<table class="rules-t" style="margin-top:14px"><thead><tr><th>Table</th>
        <th class="num">Rows</th><th>State</th></tr></thead><tbody>` +
        tables.map(([n,t])=>`<tr><td>${esc(n)}</td>
          <td class="num">${t.ok? (t.rows ?? 0) : "—"}</td>
          <td>${t.ok? "ok" : esc(t.error||"error")}</td></tr>`).join("") +
        `</tbody></table>`;
    }
    if(d.accounts_at_risk) h = `<div class="err" style="margin-bottom:14px">
      <b>${d.accounts_at_risk} account${d.accounts_at_risk>1?"s":""} not saved.</b>
      ${esc(d.warning)}</div>` + h;
    const sc = d.schema || {};
    h += sc.configured && sc.ok
      ? `<p class="note">Schema is managed automatically — Fynn applies it on every
         start, so a release that needs a new table just works.</p>`
      : sc.configured
        ? `<p class="note">Automatic schema failed: ${esc(sc.detail||"")}</p>`
          + connectionTable(sc.connection||{})
        : `<p class="note">Set <b>DATABASE_URL</b> to your Supabase Postgres connection
           string and Fynn will apply the schema itself on every start. Until then the
           files in migrations/ have to be run by hand in the SQL editor.</p>`;
    if(!ok && !(sc.configured && sc.ok))
      h += `<p class="note">Without a usable schema your rules, settings and account
        mappings live only in memory, and a redeploy clears them.</p>`;
    $("#diag").innerHTML = h;
  }catch(e){ $("#diag").innerHTML = `<p class="note">${esc(e.message)}</p>`; }
}

/* ── first-run setup ──────────────────────────────────────────────────────────
   Modelled on how A2X opens: authenticate, then connect a channel. Short, and
   every step is a decision that changes what the software does next.

   Two rules follow from that. Nothing is asked that Fynn will not act on — no
   firm size, no how-did-you-hear — and everything asked is an ordinary setting,
   reachable in Settings forever afterwards. So the flow can be skipped at any
   point without leaving the workspace half-configured: every answer has a
   working default already. */
const OB_STEPS=["welcome","firm","markets","ledger","done"];
const OB_KEY="fynn_setup_step";
let OB=0, OBD=null;

function obNeeded(){ return !!(S && S.firm && S.firm.complete===false); }

function obOpen(at){
  OBD={firm:S.firm.firm, actor:S.firm.actor, platforms:[...S.firm.platforms],
       ledger:S.firm.ledger};
  OB = Number.isInteger(at) ? at : 0;
  obRender();
}

function obClose(){ $("#onboard").innerHTML=""; sessionStorage.removeItem(OB_KEY); }

/* Written through on every step, because connecting a ledger leaves the page
   entirely and coming back to a blank form would be its own small betrayal. */
async function obSave(){
  try{
    await api("/api/settings",{method:"PUT",headers:{"Content-Type":"application/json"},
      body:JSON.stringify(OBD)});
  }catch(e){ /* setup continues; Settings can correct it */ }
}

async function obFinish(skipped){
  if(!skipped) await obSave();
  try{ await api("/api/onboarding/complete",{method:"POST"}); }catch(e){}
  obClose();
  S=await api("/api/state");
  render();
}

async function obGo(i){
  if(OB>=1 && OB<=3) await obSave();      // the steps that hold answers
  OB=i; sessionStorage.setItem(OB_KEY,String(OB)); obRender();
}

function obRender(){
  const step=OB_STEPS[OB];
  const dots=OB_STEPS.slice(1,4).map((_,i)=>
    `<i class="${OB>=i+1?"on":""}"></i>`).join("");
  const counter = (OB>=1&&OB<=3) ? `<span class="step">Step ${OB} of 3</span>` : "";
  let body="", next="Continue", secondary="";

  if(step==="welcome"){
    body=`<h2>Set up Fynn</h2>
      <p class="lead">Three short steps. Everything you choose is a setting you can
      change later.</p>
      <ul class="ob-list">
        <li><span class="ob-tick">1</span><span><b>Your firm</b> — the name on the
          working paper, and who signs off approvals.</span></li>
        <li><span class="ob-tick">2</span><span><b>Marketplaces</b> — which of
          Shopee, Lazada and TikTok Shop you reconcile.</span></li>
        <li><span class="ob-tick">3</span><span><b>Your ledger</b> — Xero,
          QuickBooks, or a dry run that posts nothing.</span></li>
      </ul>`;
    next="Get started";
  }

  if(step==="firm"){
    body=`<h2>Your firm</h2>
      <p class="lead">Both appear on every working paper Fynn produces.</p>
      <div class="field"><label for="ob-firm">Firm name</label>
        <input id="ob-firm" value="${esc(OBD.firm)}" placeholder="e.g. Tan &amp; Partners"></div>
      <div class="field"><label for="ob-actor">Approvals signed by</label>
        <input id="ob-actor" value="${esc(OBD.actor)}" placeholder="e.g. D. Tan">
        <p class="hint">Written to the audit trail with every approval, and a
        timestamp.</p></div>`;
  }

  if(step==="markets"){
    body=`<h2>Which marketplaces?</h2>
      <p class="lead">Fynn reads each platform's own settlement export. Pick the ones
      your clients sell on.</p>
      <div class="field"><div id="ob-plat">
        ${["Shopee","Lazada","TikTok Shop"].map(p=>
          `<label class="pill${OBD.platforms.includes(p)?" on":""}">
           <input type="checkbox" value="${p}" ${OBD.platforms.includes(p)?"checked":""}>${p}</label>`
        ).join("")}
      </div></div>`;
  }

  if(step==="ledger"){
    const L=(S.ledgers||{});
    const row=k=>{
      const v=L[k]; if(!v) return "";
      if(v.connected) return `<span class="${v.can_post===false?"ro-txt":"ok-txt"}">${
        v.can_post===false?"read only":"connected"}</span>`;
      if(!v.configured) return `<span class="pd-txt">not configured</span>`;
      return `<a class="btn-link" href="/oauth/${k}/connect">Connect</a>`;
    };
    body=`<h2>Where do the journals go?</h2>
      <p class="lead">A dry run prepares the exact entry and posts nothing — a fine
      place to start.</p>
      <div class="field"><label for="ob-ledger">Ledger</label>
        <select id="ob-ledger">
          <option value="dry-run"${OBD.ledger==="dry-run"?" selected":""}>Dry run — post nothing</option>
          <option value="xero"${OBD.ledger==="xero"?" selected":""}>Xero — DRAFT manual journal</option>
          <option value="quickbooks"${OBD.ledger==="quickbooks"?" selected":""}>QuickBooks Online — journal entry</option>
        </select></div>
      <div class="je" style="margin-top:14px">
        <div class="ledrow"><span>Xero</span><span class="ledright">${row("xero")}</span></div>
        <div class="ledrow"><span>QuickBooks Online</span><span class="ledright">${row("quickbooks")}</span></div>
      </div>
      <p class="ob-note">Connecting is optional now. Fynn will not post anything
      until you press Post on a cycle you have reviewed.</p>`;
  }

  if(step==="done"){
    body=`<h2>Ready</h2>
      <p class="lead">Upload a settlement export to start a close, or load a sample
      cycle to see how it works first.</p>
      <p class="ob-note">Everything you just set lives under Settings, and the
      account mapping under Accounts.</p>`;
    next="Upload a file"; secondary="Load sample cycle";
  }

  $("#onboard").innerHTML=`<div class="ob-back" id="ob-back"><div class="ob" role="dialog"
      aria-modal="true" aria-label="Set up Fynn">
    <div class="ob-top">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <rect width="100" height="100" rx="22" fill="var(--logoBg)"/>
        <path d="M61 50H41V72" fill="none" stroke="var(--logoGreen)" stroke-width="17"
              stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M41 54V39Q41 25 55 25H67" fill="none" stroke="var(--navy)" stroke-width="17"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>${counter}
    </div>
    <div class="ob-body">${body}</div>
    <div class="ob-foot">
      ${OB>0&&OB<4?`<div class="dots">${dots}</div>`:""}
      <span class="grow"></span>
      ${OB>0&&OB<4?`<button id="ob-prev">Back</button>`:""}
      ${secondary?`<button id="ob-second">${esc(secondary)}</button>`:""}
      ${OB===0?`<button class="ob-skip" id="ob-skip">Skip setup</button>`:""}
      <button class="go" id="ob-next">${esc(next)}</button>
    </div>
  </div></div>`;

  if($("#ob-plat")) document.querySelectorAll("#ob-plat .pill input").forEach(i=>{
    i.onchange=()=>{
      i.parentElement.classList.toggle("on", i.checked);
      OBD.platforms=[...document.querySelectorAll("#ob-plat input:checked")].map(x=>x.value);
    };
  });
  if($("#ob-ledger")) $("#ob-ledger").onchange=()=>{ OBD.ledger=$("#ob-ledger").value; };
  if($("#ob-prev")) $("#ob-prev").onclick=()=>{ obCollect(); obGo(OB-1); };
  if($("#ob-skip")) $("#ob-skip").onclick=()=>obFinish(true);
  if($("#ob-second")) $("#ob-second").onclick=async()=>{
    await obFinish(false);
    await api("/api/cycle/sample",{method:"POST"});
    await load(); go("cycle");
  };
  $("#ob-next").onclick=async()=>{
    obCollect();
    if(OB===OB_STEPS.length-1){ await obFinish(false); go("upload"); return; }
    obGo(OB+1);
  };
  const first=$("#ob-firm")||$("#ob-ledger");
  if(first) first.focus();
}

function obCollect(){
  if($("#ob-firm")) OBD.firm=$("#ob-firm").value;
  if($("#ob-actor")) OBD.actor=$("#ob-actor").value;
  if($("#ob-ledger")) OBD.ledger=$("#ob-ledger").value;
}

/* A connection result is news about the page you are looking at, so it belongs
   on the page. alert() blocks, cannot be styled, and reads like a browser
   fault rather than an answer to the button you pressed. */
function flash(title, detail, kind){
  $("#flashwrap").innerHTML=`<div class="flash ${kind}">
    <span><b>${esc(title)}</b>${detail?esc(detail):""}</span>
    <button class="x" id="flashx" aria-label="Dismiss">&times;</button></div>`;
  $("#flashx").onclick=()=>{ $("#flashwrap").innerHTML=""; };
}

(function(){
  const q=new URLSearchParams(location.search);
  const ok=q.get("connected"), err=q.get("ledger_error");
  if(ok||err){
    // Land on Settings and drop the query, but keep it a real route so Back
    // behaves like it does everywhere else.
    history.replaceState({}, "", "/#/settings");
    if(err) flash("Could not connect", " " + err, "bad");
    else if(q.get("readonly"))
      flash(`Connected to ${ok==="xero"?"Xero":"QuickBooks Online"} for reading only.`,
            " Enough to import the chart of accounts and map every account. "
            + "Posting needs the write scope enabled on the app.", "bad");
    else flash(`Connected to ${ok==="xero"?"Xero":"QuickBooks Online"}.`,
               " Fynn will post journals there once every account is mapped.", "ok");
  }
})();

load();
</script>
</body>
</html>
