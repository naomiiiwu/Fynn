<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fynn — month-end digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFBF8;--panel:#fff;--ink:#15181C;--slate:#5D6570;--faint:#8B939E;
--rule:#E6E4DE;--ruleF:#CFCCC4;--ledger:#17563F;--ledgerBg:#EAF1ED;
--flag:#9A5A00;--flagBg:#FBF1E1;--link:#1F4E79;--linkBg:#EAF0F6;--bubF:#F4F3EF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);
-webkit-font-smoothing:antialiased;line-height:1.5;padding:28px 20px 60px}
.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.stage{display:flex;gap:0;align-items:flex-start;max-width:1060px;margin:0 auto;justify-content:center}
.main{width:600px;flex:0 0 600px;background:var(--panel);border:1px solid var(--rule);
border-radius:10px;padding:26px 30px 30px;min-height:560px}
.drawer{flex:0 0 0;width:0;overflow:hidden;margin-left:0;
transition:flex-basis .42s cubic-bezier(.4,0,.2,1),width .42s cubic-bezier(.4,0,.2,1),margin-left .42s}
.drawer.open{flex:0 0 420px;width:420px;margin-left:16px}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}

h1{font-size:21px;font-weight:600;letter-spacing:-.02em}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:14px}
.count{font-size:14px;color:var(--ledger);white-space:nowrap}
.sub{font-size:14px;color:var(--slate);margin:6px 0 22px}

.strip{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:24px}
.strip div{flex:1;padding:11px 16px;border-right:1px solid var(--rule)}
.strip div:last-child{border-right:none}
.strip .p{font-size:13px;color:var(--faint);margin-bottom:3px}
.strip .v{font-size:16px}

.sect{display:flex;justify-content:space-between;align-items:baseline;
font-size:14px;font-weight:600;padding-bottom:9px;border-bottom:1px solid var(--ruleF)}
.sect span{font-weight:400;font-size:13px;color:var(--faint)}

.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;
padding:15px 10px 15px 14px;border:none;border-bottom:1px solid var(--rule);
border-left:3px solid transparent;background:transparent;cursor:pointer;transition:background .18s}
.row:hover{background:#FAF9F6}
.row:focus-visible{outline:2px solid var(--link);outline-offset:-2px}
.row.active{background:var(--flagBg);border-left-color:var(--flag)}
.row.done{border-left-color:var(--ledger);cursor:default}
.row.done:hover{background:transparent}
.row .b{flex:1;min-width:0}
.row .t{font-size:14.5px;font-weight:500;margin-bottom:3px}
.row .m{font-size:13px;color:var(--slate)}
.row .a{font-size:14.5px;font-weight:500;white-space:nowrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:4px;background:var(--flagBg);color:var(--flag);white-space:nowrap}
.row.done .tag{background:var(--ledgerBg);color:var(--ledger)}

.closed{background:var(--ledgerBg);border-radius:8px;padding:18px 20px;margin-bottom:22px}
.closed h2{font-size:16px;font-weight:600;color:var(--ledger);margin-bottom:5px}
.closed p{font-size:13.5px;color:var(--ledger);opacity:.92}
.closed .act{margin-top:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.closed .st{font-size:13px;color:var(--ledger);opacity:.92}

.je{border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:14px}
.jrow{display:flex;justify-content:space-between;align-items:center;width:100%;
padding:13px 16px;border:none;border-bottom:1px solid var(--rule);background:transparent;
font:inherit;color:inherit;cursor:pointer;text-align:left}
.jrow:last-of-type{border-bottom:none}
.jrow:hover{background:#FAF9F6}
.jright{display:flex;gap:16px;align-items:center}
.jview{font-size:13px;color:var(--link)}
.detail{border-top:1px solid var(--rule);padding:16px 18px;display:none;background:#FDFDFB}
.detail.on{display:block}
.detail h3{font-size:14px;font-weight:600;margin-bottom:10px}
.dl{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--rule)}
.dl span:first-child{color:var(--slate)}
.dl:last-of-type{border-bottom:none;font-weight:600;padding-top:9px}
.dl:last-of-type span:first-child{color:var(--ink)}

.trail{border:1px solid var(--rule);border-radius:8px;padding:6px 18px;margin-top:8px}
.tr{display:flex;gap:14px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px;align-items:flex-start}
.tr:last-child{border-bottom:none}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 8px}
.ts{color:var(--faint);font-size:11.5px;white-space:nowrap;padding-top:2px}
.note{font-size:12.5px;color:var(--faint);margin-top:10px}

/* chat */
.chat{width:420px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;
display:flex;flex-direction:column;height:560px}
.chat header{padding:16px 20px;border-bottom:1px solid var(--rule)}
.chat .ct{font-size:14.5px;font-weight:600}
.chat .cs{font-size:12.5px;color:var(--faint);margin-top:2px}
.thread{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;padding:11px 14px;border-radius:13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.bub.f{background:var(--bubF);border-bottom-left-radius:4px;align-self:flex-start}
.bub.u{background:var(--linkBg);color:var(--link);border-bottom-right-radius:4px;align-self:flex-end}
.ev{background:var(--linkBg);color:var(--link);border-radius:8px;padding:11px 13px;font-size:12.5px;align-self:stretch}
.ev b{display:block;font-size:11.5px;margin-bottom:3px}
.typing{display:flex;gap:4px;padding:13px 15px;background:var(--bubF);border-radius:13px;
border-bottom-left-radius:4px;align-self:flex-start;width:fit-content}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
.foot{border-top:1px solid var(--rule);padding:12px 16px}
.ask{display:flex;gap:8px;margin-bottom:10px}
.ask input{flex:1;font:400 13.5px Inter,sans-serif;padding:9px 12px;border:1px solid var(--ruleF);
border-radius:7px;background:var(--panel);color:var(--ink)}
.ask input:focus{outline:2px solid var(--link);outline-offset:-1px}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{font:400 13px Inter,sans-serif;padding:8px 10px;border:1px solid var(--ruleF);
border-radius:6px;background:var(--panel);color:var(--ink);flex:1;min-width:0}
button{font:500 13px Inter,sans-serif;padding:8px 14px;border-radius:6px;cursor:pointer;
border:1px solid var(--ruleF);background:var(--panel);color:var(--ink)}
button:hover{background:var(--bubF)}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
button.go{background:var(--ledger);color:#fff;border-color:var(--ledger)}
button.go:hover{background:#12452F}
button:disabled{opacity:.55;cursor:default}
.loading{padding:60px 0;text-align:center;color:var(--faint);font-size:14px}
</style>
</head>
<body>
<div class="stage">
  <div class="main" id="main"><p class="loading">Loading cycle…</p></div>
  <div class="drawer" id="drawer"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?"−":"")+Math.abs(n).toFixed(2);
let D=null, ACTIVE=null, HISTORY=[];

// The link is the credential. Everything this page asks for is scoped to the
// token in its own URL, so a digest link for one firm cannot read another's.
const TOKEN=(location.pathname.match(/^\/c\/([^/]+)/)||[])[1]||"";

const ACCOUNTS=["Sales Returns & Allowances","Commission Expense","Marketing Expense",
"Payment Processing Fees","Shipping Expense","Other Income","Clearing Account (hold)"];

function url(path){
  if(!TOKEN) return path;
  return path+(path.includes("?")?"&":"?")+"token="+encodeURIComponent(TOKEN);
}

async function api(path,opts){
  const r=await fetch(url(path),opts);
  if(!r.ok){
    let detail=r.statusText;
    try{ detail=(await r.json()).detail||detail; }catch(e){}
    throw new Error(detail);
  }
  return r.json();
}

async function load(){
  try{ D=await api("/api/digest"); render(); }
  catch(e){ $("#main").innerHTML=`<p class="loading">${e.message}</p>`; }
}

function render(){
  const done = D.open_exceptions===0;
  let h=`<div class="head"><h1>Cycle ${D.cycle} — month-end digest</h1>
    <span class="count num">${D.lines_classified} of ${D.lines_total} classified</span></div>
    <p class="sub">${D.firm} · settlements reconciled against the payout each platform reported.</p>
    <div class="strip">`;
  D.platforms.forEach(p=>{
    h+=`<div><p class="p">${p.platform}</p><p class="v num">${fmt(p.reported_payout)}</p></div>`;
  });
  h+=`</div>`;

  if(!done){
    h+=`<p class="sect">Needs your review <span>${D.open_exceptions} open</span></p>`;
    D.exceptions.forEach(e=>{
      const act=ACTIVE===e.key?" active":"";
      h+=`<button class="row${act}" data-k="${encodeURIComponent(e.key)}">
        <span class="b"><span class="t">${e.platform} — ${label(e)}</span>
        <span class="m">${e.why}</span></span>
        <span class="a num">${fmt(e.amount)}</span><span class="tag">Open</span></button>`;
    });
  }else{
    h+=`<div class="closed"><h2>Cycle ${D.cycle} ready to post</h2>
      <p>${D.lines_total} transactions classified across ${D.platforms.length} platforms,
      summarised into ${D.platforms.length} balanced journal entries.</p>
      <div class="act"><button class="go" id="post">Post entries</button>
      <span class="st" id="poststatus">Nothing posts until you press this.</span></div></div>`;
  }

  h+=`<p class="sect" style="margin-top:26px;margin-bottom:12px">Journal entries
    <span>Open any entry to trace it back</span></p><div class="je">`;
  D.platforms.forEach(p=>{
    h+=`<button class="jrow" data-je="${p.platform}">
      <span>${p.platform}</span>
      <span class="jright"><span class="num">${fmt(p.classified_total)}</span>
      <span class="jview">View</span></span></button>
      <div class="detail" id="d-${p.platform.replace(/\s/g,'')}"></div>`;
  });
  h+=`</div>`;

  h+=`<p class="sect" style="margin-top:26px;margin-bottom:10px">Audit trail
    <span><a href="${url('/api/audit')}" style="color:var(--link)">Export working paper</a></span></p>
    <div class="trail" id="trail"><p class="note">Loading…</p></div>
    <p class="note">${D.retention}</p>`;

  $("#main").innerHTML=h;

  document.querySelectorAll(".row").forEach(r=>{
    r.onclick=()=>openExc(decodeURIComponent(r.dataset.k));
  });
  document.querySelectorAll(".jrow").forEach(b=>{
    b.onclick=()=>toggleJE(b.dataset.je);
  });
  if($("#post")) $("#post").onclick=post;
  loadTrail();
}

function label(e){
  const m={orphan_refund:"refund from an earlier cycle",partial_refund:"partial refund",
  unknown_label:"unrecognised fee",withheld_balance:"withheld balance",residual:"unexplained residual"};
  return m[e.kind]||e.kind;
}

async function loadTrail(){
  try{
    const t=await api("/api/audit.json");
    const c={source:"var(--faint)",classify:"var(--faint)",exception:"var(--flag)",
      decision:"var(--ledger)",rule:"var(--ledger)",post:"var(--ledger)"};
    $("#trail").innerHTML=t.records.map(r=>
      `<div class="tr"><span class="dot" style="background:${c[r.kind]||'var(--faint)'}"></span>
      <span class="ts num">${r.at.slice(11,19)}</span><span>${r.message}</span></div>`).join("")
      ||`<p class="note">No activity yet.</p>`;
  }catch(e){ $("#trail").innerHTML=`<p class="note">${e.message}</p>`; }
}

async function post(){
  const btn=$("#post"), status=$("#poststatus");
  btn.disabled=true; status.textContent="Posting…";
  try{
    const r=await api("/api/post",{method:"POST"});
    const refs=r.entries.map(e=>e.reference).join(", ");
    status.textContent=r.adapter==="dry-run"
      ? `Prepared via dry run — ${refs}. Nothing was sent to a ledger.`
      : `Sent to ${r.adapter} as DRAFT — ${refs}.`;
    loadTrail();
  }catch(e){ btn.disabled=false; status.textContent=e.message; }
}

async function toggleJE(platform){
  const el=$("#d-"+platform.replace(/\s/g,''));
  if(el.classList.contains("on")){ el.classList.remove("on"); return; }
  document.querySelectorAll(".detail").forEach(d=>d.classList.remove("on"));
  try{
    const j=await api("/api/journal/"+encodeURIComponent(platform));
    el.innerHTML=`<h3>${platform} — ${j.reference}</h3>`+
      j.lines.map(l=>`<div class="dl"><span>${l.account}</span>
        <span class="num">${l.side==="debit"?"":"−"}${l.amount.toFixed(2)}</span></div>`).join("")+
      `<div class="dl"><span>Debits / credits</span>
        <span class="num">${j.total_debit.toFixed(2)} / ${j.total_credit.toFixed(2)}</span></div>`+
      `<p class="note">${j.balanced?"Balanced.":"Not balanced — unresolved exceptions are excluded."}</p>`;
    el.classList.add("on");
  }catch(e){ el.innerHTML=`<p class="note">${e.message}</p>`; el.classList.add("on"); }
}

async function openExc(key){
  ACTIVE=key; HISTORY=[];
  const e=D.exceptions.find(x=>x.key===key);
  if(!e) return;
  render();
  $("#drawer").innerHTML=`<div class="chat">
    <header><p class="ct">${e.platform} — ${fmt(e.amount)}</p>
      <p class="cs">Fynn found this while classifying</p></header>
    <div class="thread" id="thread"></div>
    <div class="foot">
      <div class="ask"><input id="q" placeholder="Ask about this exception…" autocomplete="off">
        <button id="send">Ask</button></div>
      <div class="acts"><select id="acct">${ACCOUNTS.map(a=>
        `<option ${e.evidence&&e.evidence.suggested_account===a?"selected":""}>${a}</option>`).join("")}</select>
        <button class="go" id="ok">Approve</button></div>
    </div></div>`;
  $("#drawer").classList.add("open");

  const op=await api("/api/exception/opening?key="+encodeURIComponent(key));
  bubble(op.message,"f");
  HISTORY.push({role:"assistant",content:op.message});
  if(e.evidence){
    const d=document.createElement("div");
    d.className="ev";
    d.innerHTML=`<b>Evidence · ${e.evidence.confidence}% confidence · ${e.evidence.source}</b>${e.evidence.summary}`;
    $("#thread").appendChild(d);
  }

  $("#send").onclick=ask;
  $("#q").onkeydown=ev=>{ if(ev.key==="Enter") ask(); };
  $("#ok").onclick=approve;
  $("#q").focus();
}

function bubble(text,who){
  const b=document.createElement("div");
  b.className="bub "+who;
  b.textContent=text;
  $("#thread").appendChild(b);
  $("#thread").scrollTop=$("#thread").scrollHeight;
  return b;
}

async function ask(){
  const q=$("#q").value.trim();
  if(!q) return;
  $("#q").value="";
  bubble(q,"u");
  HISTORY.push({role:"user",content:q});
  const t=document.createElement("div");
  t.className="typing"; t.innerHTML="<i></i><i></i><i></i>";
  $("#thread").appendChild(t);
  $("#thread").scrollTop=$("#thread").scrollHeight;
  try{
    const r=await api("/api/exception/chat",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:ACTIVE,history:HISTORY})});
    t.remove();
    bubble(r.message,"f");
    HISTORY.push({role:"assistant",content:r.message});
  }catch(e){ t.remove(); bubble("Error: "+e.message,"f"); }
}

async function approve(){
  const account=$("#acct").value;
  try{
    D=await api("/api/approve",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({key:ACTIVE,account,side:"debit",save_rule:true})});
    bubble(`Recorded to ${account}. I will treat this label the same way next cycle unless you tell me otherwise.`,"f");
    setTimeout(()=>{
      ACTIVE=null;
      $("#drawer").classList.remove("open");
      setTimeout(()=>{$("#drawer").innerHTML="";render();},420);
    },1100);
  }catch(e){ bubble("Could not approve: "+e.message,"f"); }
}

load();
</script>
</body>
</html>
