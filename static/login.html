<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fynn — sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Crect%20width%3D%22100%22%20height%3D%22100%22%20rx%3D%2222%22%20fill%3D%22%23E3EAE5%22%2F%3E%3Cpath%20d%3D%22M61%2050H41V72%22%20fill%3D%22none%22%20stroke%3D%22%235CA97E%22%20stroke-width%3D%2217%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3Cpath%20d%3D%22M41%2054V39Q41%2025%2055%2025H67%22%20fill%3D%22none%22%20stroke%3D%22%232C3C58%22%20stroke-width%3D%2217%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Kept in step with static/app.html — this is the first screen anyone sees, and
   a sign-in that looks like a different product is its own small alarm. */
:root{--paper:#F6F6F3;--panel:#FFFFFF;--ink:#14171B;--slate:#586170;--faint:#8A929E;
--rule:#EAE8E2;--ruleF:#D7D4CB;--ledger:#16553E;--ledgerHi:#1D6B4F;--link:#1D4E79;
--danger:#A62B21;--dangerBg:#FCEEEC;--dangerRule:#EFC5BF;
--navy:#2C3C58;--logoGreen:#5CA97E;--logoBg:#E3EAE5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--paper);color:var(--ink);
line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
padding:34px;width:100%;max-width:392px;
box-shadow:0 1px 3px rgba(20,23,27,.05),0 10px 28px -14px rgba(20,23,27,.16)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:650;
letter-spacing:-.021em;margin-bottom:6px;color:var(--navy)}
.mark{width:30px;height:30px;flex:0 0 30px;display:block}
.sub{font-size:13.5px;color:var(--slate);margin-bottom:26px}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px}
input{width:100%;font:400 14px Inter,sans-serif;padding:10px 12px;
border:1px solid var(--ruleF);border-radius:8px;background:var(--panel);color:var(--ink);
transition:border-color .15s,box-shadow .15s}
input:hover{border-color:var(--slate)}
input:focus{outline:none;border-color:var(--link);box-shadow:0 0 0 3px rgba(29,78,121,.13)}
button{width:100%;margin-top:18px;font:600 14px Inter,sans-serif;padding:11px;
border-radius:8px;border:1px solid var(--ledger);background:var(--ledger);color:#fff;
cursor:pointer;transition:background .15s}
button:hover{background:var(--ledgerHi)}
button:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.err{background:var(--dangerBg);border:1px solid var(--dangerRule);color:var(--danger);
border-radius:8px;padding:11px 13px;font-size:13px;margin-bottom:18px}
.note{font-size:12px;color:var(--faint);margin-top:20px;line-height:1.55}
.alt{display:flex;align-items:center;gap:10px;margin:20px 0;color:var(--faint);
font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.alt::before,.alt::after{content:"";flex:1;height:1px;background:var(--rule)}
.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
margin-top:0;font:500 14px Inter,sans-serif;padding:11px;border-radius:8px;
border:1px solid var(--ruleF);background:var(--panel);color:var(--ink);
text-decoration:none;cursor:pointer}
.google:hover{background:#F7F7F4}
.swap{font-size:12.5px;color:var(--slate);margin-top:18px;text-align:center}
.swap a{color:var(--link);font-weight:500}
label{margin-top:14px}
label:first-of-type{margin-top:0}
</style>
</head>
<body>
<form class="card" method="POST" action="/login">
  <div class="brand">
    <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="Fynn">
      <rect width="100" height="100" rx="22" fill="var(--logoBg)"/>
      <path d="M61 50H41V72" fill="none" stroke="var(--logoGreen)" stroke-width="17"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M41 54V39Q41 25 55 25H67" fill="none" stroke="var(--navy)" stroke-width="17"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>Fynn</div>
  <p class="sub">Settlement reconciliation for Shopee, Lazada and TikTok Shop.</p>
  <div class="err" id="err" style="display:none"></div>
  <label for="email">Email</label>
  <input type="email" id="email" name="email" autocomplete="email" autofocus required>
  <label for="password">Password</label>
  <input type="password" id="password" name="password" autocomplete="current-password"
         required>
  <input type="hidden" name="next" id="next">
  <button type="submit">Sign in</button>
  <div class="alt" id="alt">or</div>
  <a class="google" id="google" href="/auth/google"><svg width="17" height="17" viewBox="0 0 48 48" aria-hidden="true">
      <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.2h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .5.1c4.1-3.8 6.6-9.4 6.6-15.6"/>
      <path fill="#34A853" d="M24 46c5.9 0 10.9-1.9 14.5-5.3l-6.9-5.4c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.500-9.1l-.3.1-6.7 5.2-.1.3C4.5 41 13.6 46 24 46"/>
      <path fill="#FBBC05" d="M11.5 28.4c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4v-.3l-6.8-5.3-.2.1C2.9 17 2 20.4 2 24s.9 7 2.5 10z"/>
      <path fill="#EA4335" d="M24 10.4c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.1 29.9 2 24 2 13.6 2 4.5 7 2.5 14l7 5.4c1.8-5.3 6.7-9 14.5-9"/>
    </svg>Continue with Google</a>
  <p class="swap">No account yet? <a href="/signup" id="tosignup">Create one</a></p>
  <p class="note">Each account has its own workspace — your rules, account mapping
  and ledger connection are yours alone.</p>
</form>
<script>
const q = new URLSearchParams(location.search);
const err = q.get("error");
if (err) {
  const box = document.getElementById("err");
  // "1" is the deliberately vague answer to a bad email or a bad password:
  // saying which was wrong tells an attacker which addresses have accounts.
  // Said on every failure, never only when the account exists: naming the
  // difference would confirm which addresses have accounts. It still answers
  // the common case — an account created with Google has no password to match,
  // and the button is directly below.
  box.innerHTML = err === "1"
    ? "That email and password do not match an account.<br>If you signed up with "
      + "Google, use <b>Continue with Google</b> below."
    : err === "nogoogle" ? "Google sign-in is not set up on this deployment."
    : String(err).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  box.style.display = "block";
}
// Carry the page the visitor was trying to reach, but only ever a path on this
// site — an absolute URL here would make the form an open redirect.
const wanted = q.get("next") || "/";
const safe = (wanted.startsWith("/") && !wanted.startsWith("//")) ? wanted : "/";
document.getElementById("next").value = safe;
document.getElementById("google").href = "/auth/google?next=" + encodeURIComponent(safe);
document.getElementById("tosignup").href = "/signup?next=" + encodeURIComponent(safe);

// Offering a sign-in route that cannot work is worse than not offering it.
fetch("/auth/providers").then(r=>r.json()).then(p=>{
  if(!p.google){
    document.getElementById("google").remove();
    document.getElementById("alt").remove();
  }
}).catch(()=>{});
</script>
</body>
</html>
